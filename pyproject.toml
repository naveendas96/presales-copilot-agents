[project]
name = "presales-copilot-agents"
version = "0.1.0"
description = "Multi-agent RFP copilot on LangGraph: requirements, traceability, architecture, estimate, risks, proposal."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["langgraph>=0.2", "httpx>=0.27", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
copilot = "copilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
